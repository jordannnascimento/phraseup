<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PhraseUp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 5-minute countdown bar -->
  <div class="timer-bar"><div class="timer-bar-fill" id="timerBarFill"></div></div>

  <div class="shell">

    <div class="statusbar">
      <span class="sb-time" id="sbTime">9:41</span>
      <div class="sb-icons">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
          <rect x="0" y="3" width="3" height="9" rx="1" fill="currentColor" opacity=".4"/>
          <rect x="4.5" y="2" width="3" height="10" rx="1" fill="currentColor" opacity=".6"/>
          <rect x="9" y="0" width="3" height="12" rx="1" fill="currentColor"/>
          <rect x="13.5" y="0" width="3" height="12" rx="1" fill="currentColor"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
          <path d="M8 2.4C10.6 2.4 12.9 3.5 14.5 5.3L16 3.7C14 1.4 11.2 0 8 0C4.8 0 2 1.4 0 3.7L1.5 5.3C3.1 3.5 5.4 2.4 8 2.4Z" fill="currentColor"/>
          <path d="M8 5.5C9.9 5.5 11.6 6.3 12.8 7.6L14.3 6C12.7 4.3 10.5 3.3 8 3.3C5.5 3.3 3.3 4.3 1.7 6L3.2 7.6C4.4 6.3 6.1 5.5 8 5.5Z" fill="currentColor"/>
          <circle cx="8" cy="11" r="1.5" fill="currentColor"/>
        </svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
          <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="currentColor" stroke-opacity=".35"/>
          <rect x="2" y="2" width="18" height="8" rx="2" fill="currentColor"/>
          <path d="M23 4.5V7.5C23.8 7.2 24.5 6.4 24.5 6C24.5 5.6 23.8 4.8 23 4.5Z" fill="currentColor" opacity=".4"/>
        </svg>
      </div>
    </div>

    <div class="app">

      <!-- Header -->
      <header class="header">
        <div class="brand">
          <div class="brand-gem">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M9 1L16 6.5V11.5L9 17L2 11.5V6.5L9 1Z" fill="#A259FF" opacity=".8"/>
              <path d="M9 1L16 6.5L9 9L2 6.5L9 1Z" fill="#C084FC"/>
            </svg>
          </div>
          <span class="brand-name">PhraseUp</span>
        </div>
        <div class="header-right">
          <div class="countdown-chip" id="countdownChip">
            <span class="countdown-icon">⏱</span>
            <span id="countdownLabel">5:00</span>
          </div>
          <div class="streak-chip">
            <span>🔥</span>
            <span id="streakNum">0</span>
          </div>
        </div>
      </header>

      <!-- Phrase panel (stays fixed while activities change) -->
      <div class="phrase-panel" id="phrasePanel">
        <div class="phrase-meta">
          <span class="phrase-num" id="phraseNum">Phrase 1</span>
          <span class="phrase-cat" id="phraseCat">Everyday</span>
        </div>
        <p class="phrase-main" id="phraseMain">Loading...</p>
        <p class="phrase-translation" id="phraseTranslation">...</p>
      </div>

      <!-- Activity area -->
      <div class="activity-wrap">
        <div class="activity-card" id="activityCard"></div>
      </div>

      <!-- Next button -->
      <button class="next-btn" id="nextBtn">
        Next activity <span class="next-arrow">→</span>
      </button>

    </div>
  </div>

  <!-- New phrase overlay -->
  <div class="new-phrase-overlay" id="newPhraseOverlay">
    <div class="overlay-content">
      <div class="overlay-emoji">✨</div>
      <p class="overlay-text">New phrase!</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
